<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Onix | Tier IV in Accra and Colocation in Dakar</title>
    <script>
      // Single Page Apps for GitHub Pages redirection
      // MIT License - https://github.com/rafgraph/spa-github-pages
      (function(l) {
        var knownTopLevel = [
          'banks-fintech', 'networks-content', 'enterprise', 'enterprise-public-sector',
          'moving-to-onix', 'solutions', 'the-facility', 'thefacility', 'infrastructure',
          'certification', 'sustainability', 'about', 'about-us', 'insights',
          'outage-diary', 'contact', 'book-a-tour', 'tour', 'board-pack', 'fr',
          'senegal', 'senegal-fr', 'home', 'o-home', 'o-ghana', 'assets'
        ];
        var segments = l.pathname.split('/').filter(Boolean);
        var pathSegmentsToKeep = 0;
        if (segments.length > 0 && knownTopLevel.indexOf(segments[0].toLowerCase()) === -1) {
          pathSegmentsToKeep = 1;
        }
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }(window.location));
    </script>
  </head>
  <body>
  </body>
</html>
